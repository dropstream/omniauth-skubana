name: Release

# Cut a release from the GitHub Releases UI: draft a release, set the tag to `vX.Y.Z`,
# and publish it. GitHub creates the tag, which fires this workflow. The gem version
# comes from the tag, so nothing needs bumping in the repo first.
on:
  release:
    types: [published]

jobs:
  # Never publish a version that has not passed the matrix.
  test:
    uses: ./.github/workflows/ci.yml

  push:
    name: Push gem to RubyGems.org
    needs: test
    runs-on: ubuntu-latest

    # Publishing uses RubyGems trusted publishing (OIDC), so there is no API key
    # secret to rotate and it works with the gemspec's `rubygems_mfa_required`.
    #
    # One-time setup on rubygems.org: open the gem -> "Trusted publishers" ->
    # "Create", with owner `dropstream`, repository `omniauth-skubana`,
    # workflow `release.yml`, and environment `release`.
    environment: release

    permissions:
      id-token: write # mandatory for trusted publishing
      # GitHub already created the release and its tag, so nothing here writes to
      # the repo: `rake release` sees the tag and skips its own tag-and-push step.
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          # rubygems/release-gem installs its own short-lived git credentials.
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      # The committed VERSION is a 0.0.0 placeholder; the tag, minus its `v`, is the
      # gem version.
      - name: Write VERSION from the release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG_NAME#v}"
          if ! [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag ${TAG_NAME} is not of the form vX.Y.Z."
            exit 1
          fi
          echo "$version" > VERSION
          # Gemfile.lock records this gem's own version, and setup-ruby leaves Bundler in
          # deployment (frozen) mode, which refuses to run against a stale lockfile.
          BUNDLE_DEPLOYMENT=false BUNDLE_FROZEN=false bundle lock --local
          # `rake release` refuses to run with uncommitted changes. This commit stays
          # local: the release tag already exists, so `rake release` skips pushing.
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "Release ${TAG_NAME}" VERSION Gemfile.lock
          echo "Releasing omniauth-skubana ${version}"

      # Builds the gem and runs `gem push` against the gemspec's allowed_push_host.
      - name: Push to RubyGems.org
        uses: rubygems/release-gem@v1
